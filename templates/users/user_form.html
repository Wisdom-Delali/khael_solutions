{% extends 'base.html' %}
{% block title %}{{ action }} User{% endblock %}
{% block topbar_title %}{{ action }} User{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'core:user_list' %}">Users</a></li>
    <li class="breadcrumb-item active">{{ action }}</li>
  </ol>
</nav>
<div class="page-header"><div><h1>{{ action }} User</h1></div></div>
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><h6>User Details</h6></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row g-3">
            {% if action == 'Create' %}
            <div class="col-12">
              <label class="form-label">Username <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" required />
            </div>
            {% endif %}
            <div class="col-sm-6">
              <label class="form-label">First Name</label>
              <input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name|default:'' }}" />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Last Name</label>
              <input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name|default:'' }}" />
            </div>
            <div class="col-12">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ edit_user.email|default:'' }}" />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Role <span class="text-danger">*</span></label>
              <select name="role" class="form-select">
                {% for val, label in roles %}
                <option value="{{ val }}" {% if edit_user and edit_user.role == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Department</label>
              <select name="department" class="form-select">
                <option value="">No Department</option>
                {% for dept in departments %}
                <option value="{{ dept.pk }}" {% if current_dept and current_dept.pk == dept.pk %}selected{% endif %}>{{ dept.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Password {% if action == 'Edit' %}<span class="text-muted">(leave blank to keep current)</span>{% else %}<span class="text-danger">*</span>{% endif %}</label>
              <input type="password" name="password" class="form-control" {% if action == 'Create' %}required{% endif %} />
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{% url 'core:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ action }} User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
